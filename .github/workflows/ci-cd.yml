name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx eslint app.js || echo "No linter configured"

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t movie-library .
      - name: Run container
        run: |
          docker run -d -p 3001:3001 --name movie-library movie-library
          sleep 3
          curl -f http://localhost:3001/health
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag movie-library ${{ secrets.DOCKER_USERNAME }}/movie-library:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/movie-library:latest
